name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Build DMG and publish the release
    runs-on: macos-latest
    permissions:
      contents: write       # create the release and upload the DMG
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches VERSION
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' doppeldock)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $v in doppeldock"
            exit 1
          fi

      - name: Build the DMG
        run: tools/make-dmg.sh dist

      # The script itself and a source archive (git archive output is the same
      # bytes every time for the same commit). Homebrew installs this archive.
      - name: Add the script, the source archive and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp doppeldock dist/doppeldock
          git archive --format=tar.gz --prefix="doppeldock-$v/" -o "dist/doppeldock-$v.tar.gz" HEAD
          (cd dist && shasum -a 256 DoppelDock.dmg doppeldock "doppeldock-$v.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - name: Record build provenance (signed)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/DoppelDock.dmg
            dist/doppeldock
            dist/doppeldock-*.tar.gz

      # Also attach the signed provenance to the release, for offline checks.
      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/doppeldock-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - name: Write the release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            cat <<'NOTES'
          **Download:** `DoppelDock.dmg` below. It isn't notarized by Apple, so the first time
          open it via **System Settings › Privacy & Security › Open Anyway** (see the note inside the DMG).
          To check it was built by this repository's release workflow:
          ```bash
          gh attestation verify DoppelDock.dmg -R ZarinLab/doppeldock
          gh attestation verify --bundle doppeldock-X.Y.Z.intoto.jsonl DoppelDock.dmg -R ZarinLab/doppeldock   # offline
          ```

          **Homebrew:** `brew install zarinlab/tap/doppeldock && doppeldock install`

          **Terminal:**
          ```bash
          d=$(mktemp -d) && curl -fsSL https://github.com/ZarinLab/doppeldock/releases/latest/download/doppeldock -o "$d/doppeldock" && bash "$d/doppeldock" install
          ```

          *Unofficial: not affiliated with the makers of the apps it works with. App names are
          trademarks of their owners. Check each app's terms of use before using the own icon option.*

          NOTES
            awk -v v="$v" '
              index($0, "## [" v "]") == 1 { f = 1; next }
              f && (/^## \[/ || /^\[/) { exit }
              f
            ' CHANGELOG.md
          } > notes.md
          perl -pi -e "s/doppeldock-X\\.Y\\.Z/doppeldock-$v/g" notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "DoppelDock ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md --verify-tag
          fi
