name: Links

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays
  pull_request:
    paths: ["**.md", "site/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same layout as the published site (see pages.yml), so its image links resolve.
      - name: Assemble the site images
        run: |
          mkdir -p site/img/icons
          cp docs/*.gif docs/*.png site/img/
          cp docs/icons/*.png site/img/icons/

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https://github\.com/ZarinLab/doppeldock/security/advisories/new$'
            README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md docs/details.md site/index.html
          fail: true
