name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s bash -S warning doppeldock tests/smoke.sh tests/coverage.sh tools/make-dmg.sh
      - name: shfmt (code style, settings in .editorconfig)
        run: pipx run --spec shfmt-py==4.2.0 shfmt -d doppeldock tests/smoke.sh tests/coverage.sh tools/make-dmg.sh

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format=github .

  test:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Test-only sample app, pinned to an exact version and never shipped. A lockfile would
      # make GitHub raise security alerts for an old Electron that no user installs.
      - name: Get Electron's sample app  # zizmor: ignore[adhoc-packages]
        run: |
          mkdir -p "$RUNNER_TEMP/electron"
          cd "$RUNNER_TEMP/electron"
          npm init -y >/dev/null
          npm install --no-audit --no-fund electron@33.4.11
          app="$RUNNER_TEMP/electron/node_modules/electron/dist/Electron.app"
          # npm's copy is only linker-signed; sign the whole bundle so it is a valid source app.
          codesign --force --deep -s - "$app"
          echo "ELECTRON_APP=$app" >> "$GITHUB_ENV"

      - name: Smoke tests
        run: tests/smoke.sh "$ELECTRON_APP"

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true   # installs bashcov from Gemfile.lock (checksummed)

      - name: Test coverage (at least 80%)
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          bundle exec tests/coverage.sh "$ELECTRON_APP" 80

      - name: Build the DMG
        run: |
          tools/make-dmg.sh "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 -c ./*.sha256)
